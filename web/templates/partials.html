{{define "head"}}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273449;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #f59e0b;
      --ok: #22c55e;
      --bad: #ef4444;
      --pending: #eab308;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    header { border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; }
    .header-inner, main, .footer-inner { width: 100%; max-width: 1100px; margin: 0 auto; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 2rem; }
    .brand { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; }
    .brand span { color: var(--accent); }
    nav { display: flex; gap: 1.25rem; font-size: 0.9rem; }
    nav a { color: var(--muted); padding: 0.25rem 0; border-bottom: 2px solid transparent; }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--text); border-bottom-color: var(--accent); }

    .status { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--muted); }
    .status-item { display: flex; align-items: center; gap: 0.4rem; }
    .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--pending); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }

    main { flex: 1; padding: 3rem 1.5rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    .lead { margin: 0; color: var(--muted); max-width: 40rem; }
    h2 {
      margin: 2.5rem 0 1rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    footer { border-top: 1px solid var(--border); padding: 1.25rem 1.5rem; }
    .footer-inner {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem;
      font-size: 0.8rem; color: var(--muted);
    }

    @media (max-width: 560px) {
      h1 { font-size: 1.6rem; }
      .header-left { gap: 1rem; }
    }
  </style>
{{end}}

{{define "header"}}
  <header>
    <div class="header-inner">
      <div class="header-left">
        <a class="brand" href="/">{{.AppName}}<span>.</span></a>
        <nav>
          <a href="/"{{if eq .Page "home"}} class="active"{{end}}>Home</a>
          <a href="/dashboard"{{if eq .Page "dashboard"}} class="active"{{end}}>Dashboard</a>
        </nav>
      </div>
      <div class="status" aria-live="polite">
        <div class="status-item"><span class="dot" id="dot-backend"></span>Backend</div>
        <div class="status-item"><span class="dot" id="dot-influxdb"></span>InfluxDB</div>
      </div>
    </div>
  </header>
{{end}}

{{define "footer"}}
  <footer>
    <div class="footer-inner">
      <span>&copy; {{.Year}} {{.AppName}}</span>
      <span>Powered by Go and InfluxDB</span>
    </div>
  </footer>
  <script>
    (function () {
      function set(id, state) {
        var el = document.getElementById(id);
        if (el) el.className = "dot " + state;
      }
      function check() {
        fetch("/api/health", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            set("dot-backend", d.backend === "ok" ? "ok" : "bad");
            set("dot-influxdb", d.influxdb === "ok" ? "ok" : "bad");
          })
          .catch(function () {
            set("dot-backend", "bad");
            set("dot-influxdb", "bad");
          });
      }
      check();
      setInterval(check, 30000);
    })();
  </script>
{{end}}
